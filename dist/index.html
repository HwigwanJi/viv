<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="">
  <meta name="description" content="VIV. 나의 마인드, 판단과 실행이 연결되는 투자 작업실.">
  <meta name="application-name" content="VIV">
  <meta name="apple-mobile-web-app-title" content="VIV">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./viv-icon-192.png">
  <title>VIV</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script src="./ui/theme-init.js"></script>
  <link rel="stylesheet" href="./ui/viv-intro.css">
  <link rel="stylesheet" href="./ui/tailwind.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./ui/workspace-calendar.css">
  <link rel="stylesheet" href="./ui/console.css">
  <link rel="stylesheet" href="./ui/trading-terminal.css">
  <link rel="stylesheet" href="./ui/mind-avatar.css">
  <link rel="stylesheet" href="./ui/mind-companion-summary.css">
  <link rel="stylesheet" href="./ui/help-tooltip.css">
  <link rel="stylesheet" href="./benchmark.css">
  <link rel="stylesheet" href="./vendor/strategy-graph-editor.css">
  <link rel="stylesheet" href="./ui/strategy-graph-editor.css">
</head>
<body>
  <div id="app">
    <div class="viv-intro">
      <div class="viv-intro-orbit" aria-hidden="true">
        <i></i><i></i><i></i>
        <strong>viv</strong>
      </div>
      <p>good vibe, good investment</p>
      <span class="viv-intro-status" role="status" hidden>VIV 불러오는 중</span>
      <div data-viv-boot-failure hidden>
        <p role="alert">VIV를 시작하지 못했습니다.</p>
        <p role="status" data-viv-retry-status>연결이 돌아오면 같은 화면에서 다시 열 수 있습니다.</p>
        <p class="wrap-anywhere" data-viv-failed-files aria-live="polite" hidden></p>
        <button type="button" class="button spaced">다시 열기</button>
      </div>
      <noscript>VIV를 열려면 브라우저에서 JavaScript를 켜세요.</noscript>
      <a data-viv-recovery-link href="https://github.com/HwigwanJi/viv/blob/main/docs/agents/operations/self-host.md#시작-오류가-반복될-때" target="_blank" rel="noopener noreferrer">VIV 연결·시작 문제 해결 (새 탭)</a>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"></dialog>
  <script src="./ui/viv-startup.js"></script>
  <script type="module" src="./app.mjs" id="viv-app-entry"></script>
  <script type="module" src="./ui/shell.mjs"></script>
</body>
</html>
