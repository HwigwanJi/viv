<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

        <p data-apk-download hidden><a class="button" href="./downloads/chungji-1.0.0.apk" download>APK 다운로드 · Android</a></p>
        <p data-install-browser></p>
        <p data-install-status role="status" aria-live="polite"></p>
        <p><a class="button" href="/#minds?profileId=all&amp;executionMode=live&amp;view=overview">청지 열기</a></p>
      </div>
    </section>
  </main>
