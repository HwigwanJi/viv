<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111a">
  <meta name="description" content="VIV 앱을 휴대폰 홈 화면에 설치합니다.">
  <meta name="apple-mobile-web-app-title" content="VIV">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./viv-icon-192.png">
  <script src="./ui/theme-init.js"></script>
  <link rel="stylesheet" href="./ui/tailwind.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./ui/trading-terminal.css">
  <title>VIV 앱 설치</title>
</head>
<body>
  <main class="content studio-reading-content">
    <section class="studio-sheet spaced">
      <div class="studio-sheet-head"><h1>VIV 앱 설치</h1></div>
      <div class="studio-sheet-body">
        <div data-install-guide>
          <p data-install-steps>iPhone은 Safari의 공유 메뉴에서, Android는 Chrome의 더보기 메뉴에서 홈 화면에 추가하세요.</p>
          <p data-install-browser></p>
          <p><button class="button primary" type="button" data-app-install data-app-install-native hidden>웹앱으로 설치</button></p>
          <section class="spaced" data-install-handoff hidden>
            <h2 data-install-connection-title>휴대폰 연결</h2>
            <p data-install-connection role="status" aria-live="polite"></p>
            <p data-install-handoff-help hidden>VIV 서버를 켜 두고 휴대폰을 같은 Tailscale 네트워크에 연결한 뒤 이 주소를 여세요.</p>
            <div data-install-address hidden><label class="field">휴대폰 설치 주소<input type="url" readonly></label></div>
            <details class="spaced" data-install-retry-command hidden>
              <summary>이 PC에서 다시 실행할 명령</summary>
              <p>VIV 설치 폴더에서 실행하세요.</p>
              <code class="wrap-anywhere"></code>
              <p class="spaced"><button class="button" type="button" data-install-copy-command>복구 명령 복사</button></p>
            </details>
            <div class="actions spaced">
              <button class="button" type="button" data-install-copy hidden>설치 주소 복사</button>
              <button class="button" type="button" data-install-recheck hidden>연결 다시 확인</button>
              <a href="https://github.com/HwigwanJi/viv/blob/main/docs/agents/operations/self-host.md" data-install-setup hidden>모바일 연결 설정 안내</a>
            </div>
          </section>
          <p data-apk-download hidden><a class="button" href="./downloads/viv-1.0.2.apk" download>APK 다운로드 · Android</a></p>
        </div>
        <p data-install-status role="status" aria-live="polite"></p>
        <p><a class="button" data-install-open href="/#home?executionMode=paper">VIV 열기</a></p>
      </div>
    </section>
  </main>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"></dialog>
  <script type="module" src="./ui/install-page.mjs"></script>
</body>
</html>
