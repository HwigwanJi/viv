name: macOS installation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/install-viv-mac.sh'
      - 'scripts/setup-self-host-mac.mjs'
      - '.github/workflows/macos-install.yml'

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        macos: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.macos }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install with the bundled Node bootstrap and verify onboarding
        shell: bash
        run: |
          set -euo pipefail
          printf '0\n' | bash scripts/install-viv-mac.sh
          test ! -e .runtime
          if bash scripts/install-viv-mac.sh --resume; then
            echo "Resume unexpectedly worked before installation" >&2
            exit 1
          fi
          if bash scripts/install-viv-mac.sh --mobile-only; then
            echo "Mobile recovery unexpectedly worked before installation" >&2
            exit 1
          fi
          test ! -e .runtime
          mac_path=/usr/bin:/bin:/usr/sbin:/sbin
          port=4389
          mkdir .runtime
          printf 'restored fixture\n' > .runtime/self-host.sqlite
          if blocked=$(env PATH="$mac_path" /bin/bash scripts/install-viv-mac.sh --target pc --client manual --port "$port" 2>&1); then
            echo "Installation unexpectedly started with a missing original .env" >&2
            exit 1
          fi
          grep -F '원래 .env 파일이 필요합니다' <<< "$blocked"
          test "$(cat .runtime/self-host.sqlite)" = 'restored fixture'
          test "$(ls -A .runtime)" = 'self-host.sqlite'
          test ! -e .env && test ! -e node_modules
          rm .runtime/self-host.sqlite
          rmdir .runtime
          receipt=$(env PATH="$mac_path" /bin/bash scripts/install-viv-mac.sh --target pc --client manual --port "$port")
          node -e 'const r=JSON.parse(process.argv[1]); if(!r.serverPid || r.mcpStatus!=="endpoint-ready" || r.liveRunner!=="disabled") throw Error(JSON.stringify(r))' "$receipt"
          pid=$(node -p 'JSON.parse(process.argv[1]).serverPid' "$receipt")
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          rerun=$(env PATH="$mac_path" /bin/bash scripts/install-viv-mac.sh --target pc --client manual)
          node -e 'const [r,installed]=process.argv.slice(1).map(JSON.parse); if(r.serverPid!==null || r.mcpStatus!=="endpoint-ready" || r.desktopUrl!==installed.desktopUrl) throw Error(JSON.stringify(r))' "$rerun" "$receipt"
          kill "$pid"
          for attempt in {1..25}; do
            if ! curl -fsS "http://127.0.0.1:$port/" -o /dev/null 2>/dev/null; then break; fi
            sleep 0.2
          done
          resumed=$(env PATH="$mac_path" /bin/bash scripts/install-viv-mac.sh --resume)
          pid=$(node -e 'const [r,installed]=process.argv.slice(1).map(JSON.parse); if(!r.serverPid || r.mcpStatus!=="endpoint-ready" || r.desktopUrl!==installed.desktopUrl) throw Error(JSON.stringify(r)); console.log(r.serverPid)' "$resumed" "$receipt")
          curl -fsS "http://127.0.0.1:$port/mcp" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"viv_onboarding","arguments":{}}}' |
            node -e 'let s=""; process.stdin.on("data",b=>s+=b).on("end",()=>{const r=JSON.parse(s).result; if(r.isError || r.structuredContent.next!=="ask_interest_and_budget") throw Error("Fresh onboarding failed")})'
          node_bin=( "$PWD"/.runtime/node-v24*-darwin-*/bin )
          test -x "${node_bin[0]}/node"
          export PATH="${node_bin[0]}:$PATH"
          if [[ ! -x /Applications/Tailscale.app/Contents/MacOS/Tailscale ]]; then
            mobile_cli="$RUNNER_TEMP/viv-mobile-cli"
            mkdir -p "$mobile_cli"
            printf '%s\n' '#!/bin/sh' 'printf "%s\\n" "{\"BackendState\":\"NeedsLogin\"}"' > "$mobile_cli/tailscale"
            chmod +x "$mobile_cli/tailscale"
            recovered=$(PATH="$mobile_cli:$PATH" bash scripts/install-viv-mac.sh --mobile-only --client claude)
            node -e 'const r=JSON.parse(process.argv[1]); if(r.desktopStatus!=="reused" || r.mcpStatus!=="not-requested" || r.mobileStatus!=="needs-action" || !r.mobileRetryCommand.includes("--mobile-only")) throw Error(JSON.stringify(r))' "$recovered"
          fi
          clients="$RUNNER_TEMP/viv-mcp-clients"
          npm install --prefix "$clients" --ignore-scripts --no-audit --no-fund @openai/codex@0.167.1 @anthropic-ai/claude-code@2.1.322
          node "$clients/node_modules/@anthropic-ai/claude-code/install.cjs"
          export PATH="$clients/node_modules/.bin:$PATH"
          codex --version
          claude --version
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/viv-claude-settings"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          for client in codex claude; do
            registered=$(bash scripts/install-viv-mac.sh --target pc --client "$client")
            node -e 'const r=JSON.parse(process.argv[1]); if(r.mcpStatus!=="registered" || r.onboardingTool!=="viv_onboarding") throw Error(JSON.stringify(r))' "$registered"
          done
